[package]
name = "vopono"
description = "Launch applications via VPN tunnels using temporary network namespaces"
version = "0.10.22"
authors = ["James McMurray <jamesmcm03@gmail.com>"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/jamesmcm/vopono"
homepage = "https://github.com/jamesmcm/vopono"
readme = "README.md"
keywords = ["vopono", "vpn", "wireguard", "openvpn", "netns"]

[workspace]
members = [".", "vopono_core"]
default-members = ["."]
exclude = ["vopono-gui"]

[dependencies]
vopono_core = { path = "vopono_core" }
anyhow = "1"
directories-next = "2"
log = "0.4"
pretty_env_logger = "0.5"
clap = { version = "4", features = ["derive"] }
which = "8"
dialoguer = "0.12"
compound_duration = "2"
signal-hook = "0.4"
walkdir = "2"
chrono = "0.4"
bs58 = "0.5"
nix = { version = "0.31", features = ["signal", "process", "socket", "uio", "mount", "term"] }
config = "0.15"
basic_tcp_proxy = "0.3"
serde = { version = "1", features = ["derive", "std"] }
serde_json = "1"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"
shellexpand = { version = "3", features = ["full"] }
shell-words = "1"
interprocess = "2"
wincode = { version = "0.6", features = ["derive", "std"] }

[package.metadata.deb]
maintainer = "James McMurray <jamesmcm03@gmail.com>"
recommends = "wireguard-tools, openvpn, openssh-client, redsocks"
maintainer-scripts = "packaging/debian"
assets = [
    ["target/release/vopono", "usr/bin/", "755"],
    ["vopono.service", "usr/lib/systemd/system/vopono.service", "644"],
]
# Not supported in Github Actions image with cargo-deb yet
# suggests = "shadowsocks-libev, openfortivpn"

[package.metadata.generate-rpm]
release = "1"
post_install_script = "packaging/rpm/post-install.sh"
assets = [
    { source = "target/release/vopono", dest = "/usr/bin/vopono", mode = "0755" },
    { source = "vopono.service", dest = "/usr/lib/systemd/system/vopono.service", mode = "0644" },
]

[package.metadata.generate-rpm.variants.fedora]
# Placeholder: the Fedora action overrides this from rpm --eval '%{?fedora}'.
release = "1.fcFEDORA"
