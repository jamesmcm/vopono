name: PullRequest

on:
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs: 
  quickcheck:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rustversion.outputs.rustversion }}
    steps:
    - uses: actions/checkout@v4
    - run: cargo check
    - run: cargo pkgid
    - run: 'echo "$(cargo pkgid | cut -d# -f2)"'
    - id: rustversion
      run: 'echo "rustversion=$(cargo pkgid | cut -d# -f2)" >> "$GITHUB_OUTPUT"'
  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Clippy
      run: rustup component add clippy rustfmt
    - name: Clippy
      run: cargo clippy --workspace --all-features --all-targets -- -D warnings
    - name: Rustfmt
      run: cargo fmt --all -- --check
    - name: Test
      run: cargo test --workspace
  gui:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install GUI dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libudev-dev libxdo-dev
    - name: Rustfmt
      run: cargo fmt --manifest-path vopono-gui/Cargo.toml -- --check
    - name: Clippy
      run: cargo clippy --manifest-path vopono-gui/Cargo.toml --all-features --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --manifest-path vopono-gui/Cargo.toml --locked
