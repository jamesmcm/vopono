name: Diagnostics and synthetic VPN

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

jobs:
  synthetic-wireguard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        openvpn: ['release/2.6', 'release/2.7']
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iproute2 wireguard-tools nftables iptables python3 python3-venv openssl natpmpc autoconf automake libtool pkg-config libssl-dev libcap-ng-dev libnl-genl-3-dev python3-docutils
      - name: Build the selected supported OpenVPN series
        run: |
          git clone --depth 1 --branch '${{ matrix.openvpn }}' https://github.com/OpenVPN/openvpn.git "$RUNNER_TEMP/openvpn-source"
          cd "$RUNNER_TEMP/openvpn-source"
          autoreconf -ivf
          ./configure --prefix="$RUNNER_TEMP/openvpn-runtime" --disable-dco --disable-lzo --disable-lz4 --disable-pkcs11 --disable-plugin-auth-pam
          make -j2
          make install
          echo "$RUNNER_TEMP/openvpn-runtime/sbin" >> "$GITHUB_PATH"
      - run: cargo build --locked
      - name: Check interoperability with the official MCP client SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/mcp-sdk"
          "$RUNNER_TEMP/mcp-sdk/bin/pip" install 'mcp>=1.10,<3'
          "$RUNNER_TEMP/mcp-sdk/bin/python" tests/mcp_sdk.py "$PWD/target/debug/vopono"
      - name: Test local VPNs, sharing, leases, restart, capacity and network changes
        run: sudo env "PATH=$PATH" unshare --mount --net --pid --fork --mount-proc tests/network/wireguard.sh --isolated "$PWD/target/debug/vopono"
  public-provider-catalogues:
    # A public service outage must not make offline PR tests nondeterministic.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        provider: [mullvad, privateinternetaccess]
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --locked -- provider check '${{ matrix.provider }}' --json
